bundle:
  name: coverpath

variables:
  warehouse_id:
    description: "Serverless SQL Warehouse ID (found in Databricks UI → SQL Warehouses → Connection Details)"
  catalog:
    description: "Unity Catalog catalog name for CoverPath demo tables"
    default: coverpath_demo
  schema:
    description: "Unity Catalog schema name for CoverPath demo tables"
    default: coverpath_demo
  model:
    description: "Databricks-hosted LLM serving endpoint name"
    default: databricks-claude-sonnet-4-6

targets:
  dev:
    default: true

  4ck:
    workspace:
      host: https://fevm-serverless-stable-4ck9qn.cloud.databricks.com
      profile: amneal

resources:
  apps:
    coverpath_app:
      name: "coverpath"
      description: "CoverPath — Rare Disease Coverage Intelligence"
      source_code_path: ./app
      resources:
        - name: coverpath-warehouse
          description: "Serverless SQL Warehouse for evidence queries"
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: "CAN_USE"
